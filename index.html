<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>同屏对战小游戏</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16px;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        background: #f4f6fa;
        color: #111827;
        overscroll-behavior: none;
        user-select: none;
      }

      main {
        width: min(100%, 800px);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .status {
        margin: 0;
        color: #4b5563;
        font-size: 14px;
      }

      .online {
        display: grid;
        grid-template-columns: 2fr 1fr auto auto;
        gap: 8px;
        margin-bottom: 12px;
      }

      input {
        min-height: 40px;
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0 10px;
        font: inherit;
      }

      canvas {
        width: 100%;
        aspect-ratio: 12 / 7;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #eef2f7;
        display: block;
        touch-action: none;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }

      .player {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .player h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      button {
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        color: #111827;
        font-size: 14px;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      button.active-blue {
        border-color: #2563eb;
        background: #dbeafe;
      }

      button.active-red {
        border-color: #dc2626;
        background: #fee2e2;
      }

      .tip {
        margin: 10px 0 0;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.6;
      }

      @media (max-width: 560px) {
        body {
          align-items: start;
          padding-top: max(12px, env(safe-area-inset-top));
        }

        .toolbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
        }

        h1 {
          font-size: 22px;
        }

        .controls {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }

        .online {
          grid-template-columns: 1fr;
        }

        .player {
          padding: 8px;
        }

        .player h2 {
          font-size: 14px;
        }

        .cards {
          gap: 6px;
        }

        button {
          min-height: 48px;
          font-size: 15px;
        }

        canvas {
          border-radius: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <h1>同屏对战小游戏</h1>
        <p id="statusText" class="status">蓝方左半场，红方右半场。</p>
      </div>
      <section class="online" aria-label="双设备联机">
        <input id="serverUrl" value="wss://teams-massachusetts-mirror-shipped.trycloudflare.com">
        <input id="roomCode" placeholder="房间号">
        <button id="createRoom" type="button">创建房间</button>
        <button id="joinRoom" type="button">加入房间</button>
      </section>
      <canvas id="gameCanvas" width="720" height="420"></canvas>
      <section class="controls" aria-label="双方出兵卡牌">
        <div class="player">
          <h2>蓝方</h2>
          <div id="blueCards" class="cards"></div>
        </div>
        <div class="player">
          <h2>红方</h2>
          <div id="redCards" class="cards"></div>
        </div>
      </section>
      <p class="tip">先点卡牌，再点己方半场出兵。双方单位会自动推进、攻击单位和基地。</p>
    </main>

    <script type="module">
      import {
        CARDS,
        createGame,
        drawGame,
        getCardOrder,
        selectCard,
        spawnUnit,
        stepGame,
      } from './game.js';

      const canvas = document.querySelector('#gameCanvas');
      const statusText = document.querySelector('#statusText');
      const serverUrl = document.querySelector('#serverUrl');
      const roomCode = document.querySelector('#roomCode');
      const createRoom = document.querySelector('#createRoom');
      const joinRoom = document.querySelector('#joinRoom');
      const ctx = canvas.getContext('2d');
      let game = createGame();
      let lastTime = performance.now();
      let socket = null;
      let onlineTeam = null;

      /** 联机消息发送：只传玩家操作，游戏规则仍复用本地战斗内核。 */
      function sendOnlineAction(action) {
        if (!socket || socket.readyState !== WebSocket.OPEN || !onlineTeam) return;
        socket.send(JSON.stringify({ type: 'action', action }));
      }

      /** 联机消息应用：收到对手操作后在本地执行同一选卡或出兵动作。 */
      function applyOnlineAction(team, action) {
        try {
          if (action.kind === 'select') game = selectCard(game, team, action.cardId);
          if (action.kind === 'spawn') game = spawnUnit(game, team, action.x, action.y);
          renderCards();
        } catch (error) {
          game = { ...game, message: error.message };
        }
      }

      /** 建立 WebSocket 房间连接，创建方固定蓝方，加入方固定红方。 */
      function connectOnline(message) {
        if (socket) socket.close();
        socket = new WebSocket(serverUrl.value.trim());
        socket.addEventListener('open', () => socket.send(JSON.stringify(message)));
        socket.addEventListener('message', (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'created' || data.type === 'joined') {
            onlineTeam = data.team;
            roomCode.value = data.roomId;
            game = createGame();
            game = { ...game, message: `${data.team === 'blue' ? '蓝方' : '红方'} 已连接` };
            renderCards();
          }
          if (data.type === 'peer-joined') game = { ...game, message: '对手已加入' };
          if (data.type === 'peer-left') game = { ...game, message: '对手已离开' };
          if (data.type === 'action') applyOnlineAction(data.team, data.action);
          if (data.type === 'error') game = { ...game, message: data.message };
        });
        socket.addEventListener('error', () => {
          game = { ...game, message: '服务器连接失败' };
        });
      }

      /** 卡牌按钮事件：选择对应阵营下次出兵单位。 */
      function bindCards(team, containerId) {
        const container = document.querySelector(containerId);
        container.replaceChildren(...getCardOrder().map((cardId) => {
          const card = CARDS[cardId];
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.team = team;
          button.dataset.card = cardId;
          button.textContent = `${card.name} ${card.cost}`;
          button.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (onlineTeam && onlineTeam !== team) return;
            game = selectCard(game, team, cardId);
            sendOnlineAction({ kind: 'select', cardId });
            renderCards();
          });
          return button;
        }));
      }

      /** 同步卡牌选中态，让双方玩家知道当前将派出哪个单位。 */
      function renderCards() {
        document.querySelectorAll('button[data-team]').forEach((button) => {
          const team = button.dataset.team;
          const isActive = game.players[team].selectedCard === button.dataset.card;
          button.classList.toggle(`active-${team}`, isActive);
        });
      }

      /** 画布点击事件：按点击所在半场决定蓝方或红方出兵。 */
      canvas.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (event.clientY - rect.top) * (canvas.height / rect.height);
        const team = x < canvas.width / 2 ? 'blue' : 'red';
        if (onlineTeam && onlineTeam !== team) return;

        try {
          game = spawnUnit(game, team, x, y);
          sendOnlineAction({ kind: 'spawn', x, y });
        } catch (error) {
          game = { ...game, message: error.message };
        }
      });

      /** 创建/加入房间事件：让两台设备通过 Colab 中转同步操作。 */
      createRoom.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        connectOnline({ type: 'create' });
      });

      joinRoom.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        connectOnline({ type: 'join', roomId: roomCode.value.trim() });
      });

      /** 主循环：推进对战状态，刷新画面与顶部状态。 */
      function loop(now) {
        const deltaSeconds = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        game = stepGame(game, deltaSeconds);
        statusText.textContent = game.message;
        drawGame(ctx, game);
        requestAnimationFrame(loop);
      }

      bindCards('blue', '#blueCards');
      bindCards('red', '#redCards');
      renderCards();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
